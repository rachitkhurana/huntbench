<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huntbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<aside class="sidebar">
  <div class="ws"><span class="logo">h</span><span class="nm">Huntbench</span></div>
  <div class="cmdtrigger" id="cmdtrigger"><span>⌕</span><span>Search or jump…</span><span class="kbd">⌘K</span></div>
  <div class="navitem" data-view="list"><span class="ic" id="ic-list"></span><span>All jobs</span><span class="badge" id="nb-list"></span></div>
  <div class="navitem" data-view="board"><span class="ic" id="ic-board"></span><span>Board</span></div>
  <div class="navitem" data-view="inbox"><span class="ic" id="ic-inbox"></span><span>Inbox</span><span class="badge" id="nb-inbox"></span></div>
  <div class="navitem" data-view="profile"><span class="ic" id="ic-profile"></span><span>Profile</span></div>

  <div class="seclabel" data-sec="region"><span class="chev">▾</span> Region</div>
  <div class="chips" id="regionChips" data-sec="region"></div>
  <div class="seclabel" data-sec="status"><span class="chev">▾</span> Status</div>
  <div class="chips" id="statusChips" data-sec="status"></div>
  <div class="seclabel" data-sec="stats"><span class="chev">▾</span> Overview</div>
  <div class="mini" id="stats" data-sec="stats"></div>

  <div class="sidefoot"><span style="font-size:11px;color:var(--text3)">⌘K to search · j/k to move</span></div>
</aside>

<main class="main">
  <div class="topbar">
    <span class="vtitle" id="vtitle">All jobs</span>
    <span class="vcount" id="vcount"></span>
    <span class="sp"></span>
    <div class="seg" id="listmode-seg" style="display:none">
      <button data-lm="list" title="list layout">List</button>
      <button data-lm="cards" title="card layout">Cards</button>
    </div>
    <input id="q" class="tbtn" style="width:210px" type="search" placeholder="Filter…" autocomplete="off">
    <select id="sort" class="tbtn" title="sort"></select>
    <button id="addBtn" class="tbtn" title="add a job posting or board from a URL">＋ Add job</button>
    <button id="syncBtn" class="tbtn" title="request a Gmail inbox sync (runs via Claude in chat)">✉ Sync inbox</button>
    <button id="scanBtn" class="tbtn" title="scan ATS portals">⟳ Scan</button>
  </div>
  <div class="content" id="content"></div>
</main>

<div class="backdrop" id="backdrop"></div>
<div class="panel" id="panel">
  <div class="panelbar"><span class="pb-crumb" id="pbCrumb"></span><span class="sp" style="flex:1"></span>
    <button class="iconbtn" id="panelClose" title="close (Esc)">✕</button></div>
  <div class="panelbody" id="panelBody"></div>
</div>

<div class="cmdk-back" id="cmdkBack">
  <div class="cmdk">
    <input id="cmdkInput" placeholder="Type a command or search jobs…" autocomplete="off">
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>

<div class="cmdk-back" id="addBack">
  <div class="addmodal">
    <div class="am-head">Add a job</div>
    <div class="seg am-seg" id="addSeg">
      <button data-k="posting" class="on">Posting</button>
      <button data-k="board">Board</button>
    </div>
    <input id="addUrl" class="am-input" type="url" placeholder="Paste a job posting URL…" autocomplete="off">
    <div class="am-hint" id="addHint"></div>
    <div class="am-actions">
      <button class="tbtn" id="addCancel">Cancel</button>
      <button class="ob-btn" id="addGo">Add</button>
    </div>
    <div class="am-result" id="addResult"></div>
  </div>
</div>

<div id="onboard"></div>
<div id="toasts"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
